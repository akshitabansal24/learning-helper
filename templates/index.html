<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IntelliTutor Learning Helper</title>
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <style>
        :root {
            --bs-primary: #3c45b9 !important;
        }
        .bg-primary {
            background-color: #3c45b9 !important;
        }
        .navbar-dark .navbar-brand,
        .navbar-dark .navbar-nav .nav-link {
            color: rgb(255, 255, 255) !important; /* Adjust text color for contrast */
        }
        .btn-custom {
        background-color: #3c45b9 !important;
        border-color:#3c45b9 !important;
        color: rgb(255, 255, 255) !important; /* Ensures readability */
        }

        .btn-custom:hover {
            background-color: #323995 !important; /* Slightly darker shade for hover effect */
            border-color: #323995 !important;
        }
    </style>
</head>
<body class="bg-light">
    
    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">IntelliTutor</a>
            <img src="{{ url_for('static', filename='images/elearning.png') }}" alt="IntelliTutor Logo" class="logo">
        </div>
    </nav>
    
    <div class="container mt-5 p-4 bg-white rounded shadow-lg">
        <h2 class="text-center text-primary" style="color: #3c45b9 !important;">Upload an Image</h2>
        <div class="mb-3">
            <input class="form-control" type="file" id="fileInput" accept="image/*">
        </div>
        <button class="btn btn-custom w-100" id="uploadBtn" onclick="uploadImage()">Submit</button>
        
        <div id="loadingSpinner" class="text-center mt-3 d-none">
            <div class="spinner-border text-primary" role="status"></div>
            <p>Processing...</p>
        </div>
    </div>
    
    <div class="row mt-4 container mx-auto">
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h5>Cleaned Image</h5>
                </div>
                <div class="card-body text-center" id="cleanedImageBox">
                    <p>No image uploaded.</p>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white text-center">
                    <h5>Generated Q&A</h5>
                </div>
                <div class="card-body" id="qaBox">
                    <p>Upload an image to see the results.</p>
                </div>
            </div>
        </div>
    </div>
    
    <!-- Footer -->
    <footer class="bg-primary text-white text-center p-3 mt-5 shadow">
        &copy; 2025 IntelliTutor. All Rights Reserved.
    </footer>
    
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        let recognition;
        let isListening = false;
        let currentAnswer = ""; // Stores the correct answer when listening starts
    
        function uploadImage() {
            const fileInput = document.getElementById('fileInput');
            const cleanedImageBox = document.getElementById('cleanedImageBox');
            const qaBox = document.getElementById('qaBox');
            const uploadBtn = document.getElementById('uploadBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
    
            if (!fileInput.files.length) {
                alert("Please select an image first.");
                return;
            }
    
            uploadBtn.disabled = true;
            loadingSpinner.classList.remove("d-none");
    
            const formData = new FormData();
            formData.append('img', fileInput.files[0]);
    
            fetch('https://learning-helper-2025-451212.uc.r.appspot.com/processImage', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(result => {
                if (result.cleaned_image_url) {
                    cleanedImageBox.innerHTML = `<img src="${result.cleaned_image_url}" class="img-fluid rounded shadow" alt="Cleaned Image">`;
                } else {
                    cleanedImageBox.innerHTML = `<p>No cleaned image received.</p>`;
                }
    
                if (result.qa_response && result.qa_response.QA && Array.isArray(result.qa_response.QA)) {
                    qaBox.innerHTML = result.qa_response.QA.map((qa, index) => `
                        <div class="alert alert-light border qa-card">
                            <strong>Q:</strong> ${qa.Ques}<br>
                            <strong>A:</strong> ${qa.Ans}
                            <div class="mt-2">
                                <button class="btn btn-sm btn-primary me-2" onclick="speakQues('${qa.Ques}')">
                                    🔊 Play Question
                                </button>
                                <button id="listenBtn${index}" class="btn btn-sm btn-success" onclick="toggleSpeechRecognition(this, '${qa.Ans}', ${index})">
                                    🎤 Start Listening
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    qaBox.innerHTML = "<p>No QA data found in response</p>";
                }
            })
            .catch(error => {
                console.error("Error:", error);
                qaBox.innerText = "Error processing the response";
            })
            .finally(() => {
                uploadBtn.disabled = false;
                loadingSpinner.classList.add("d-none");
            });
        }
    
        function speakQues(questionText) {
            const speechSynth = window.speechSynthesis;
            if (!speechSynth.speaking && questionText.trim().length) {
                const newUtter = new SpeechSynthesisUtterance(questionText);
                speechSynth.speak(newUtter);
            }
        }
    
        function toggleSpeechRecognition(button, correctAnswer, index) {
            if (!('webkitSpeechRecognition' in window)) {
                alert('Speech recognition not supported in this browser.');
                return;
            }
    
            if (!recognition) {
                recognition = new webkitSpeechRecognition();
                recognition.continuous = false;
                recognition.interimResults = false;
                recognition.lang = 'en-US';
    
                recognition.onresult = function(event) {
                    if (isListening) {
                        const transcript = event.results[0][0].transcript;
                        console.log("User response:", transcript);
                        currentAnswer = transcript; // Store user's response
                    }
                };
    
                recognition.onend = function() {
                    isListening = false;
                    button.innerHTML = "🎤 Start Listening";
                    button.classList.remove("btn-danger");
                    button.classList.add("btn-success");
    
                    // Compare only after stopping
                    if (currentAnswer && correctAnswer) {
                        checkAnswer(currentAnswer, correctAnswer);
                    }
                };
            }
    
            if (isListening) {
                recognition.stop(); // Stop recognition and trigger `onend`
            } else {
                currentAnswer = ""; // Reset user response before starting
                recognition.start();
                isListening = true;
                button.innerHTML = "🛑 Stop Listening";
                button.classList.remove("btn-success");
                button.classList.add("btn-danger");
            }
        }
    
        function checkAnswer(userAnswer, correctAnswer) {
            const similarity = compareText(userAnswer.toLowerCase(), correctAnswer.toLowerCase());
            console.log('Your answer similarity: ',similarity);
        }
    
        function compareText(str1, str2) {
            let matches = 0;
            const words1 = str1.split(" ");
            const words2 = str2.split(" ");
    
            words1.forEach(word => {
                if (words2.includes(word)) matches++;
            });
    
            return ((matches / Math.max(words1.length, words2.length)) * 100).toFixed(2);
        }
    </script>
</body>
</html>
