<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>IntelliTutor Learning Helper</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='images/elearning.png') }}">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-light sticky-top bg-light shadow">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">IntelliTutor</a>
            <img src="{{ url_for('static', filename='images/elearning.png') }}" alt="IntelliTutor Logo" class="logo">
        </div>
    </nav>
    
    <div class="container mt-3 p-4 bg-white rounded shadow-lg">
        <div class="mb-3">
            <input class="form-control border-dark" type="file" id="fileInput" accept="image/*">
        </div>
        <div class="row">
            <div class="col-md-6">
                <button class="btn btn-outline-dark w-100" id="uploadBtn_study" onclick="uploadImage(false)">Study</button>
            </div>
            <div class="col-md-6">
                <button class="btn btn-outline-dark w-100" id="uploadBtn_quiz" onclick="uploadImage(true)">Quiz</button>
            </div>
        </div>
        
        <div id="loadingSpinner" class="text-center mt-3 d-none">
            <div class="spinner-border text-dark" role="status"></div>
            <p>Processing...</p>
        </div>
    </div>
    
    <div class="row mt-3 container mx-auto" style="display:none;" id="responseScreen">
        <div class="col-md-6" id="cleanedImageDiv">
            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h5>Cleaned Image&nbsp;&nbsp;
                        <button onclick="downloadCleanImage()" class="btn btn-outline-light">
                            <i class="bi bi-download"></i>
                        </button>
                    </h5>
                </div>
                <div class="card-body text-center" style="overflow-y: auto; height: 47vh;" id="cleanedImageBox">
                    <p>No image uploaded.</p>
                </div>
            </div>
        </div>
        <div class="col-md-6" id="QADiv">
            <div class="card shadow">
                <div class="card-header bg-dark text-white text-center">
                    <h5>Generated Q&A&nbsp;&nbsp;
                        <button onclick="downloadPdf()" class="btn btn-outline-light">
                            <i class="bi bi-download"></i>
                        </button>
                    </h5>
                    
                </div>
                <div class="card-body" style="overflow-y: auto; height: 47vh;" id="qaBox">
                    <p>Upload an image to see the results.</p>
                </div>
            </div>
        </div>
    </div>
 
    
    <footer class="bg-dark text-white text-center p-3 mt-3 shadow" style="position: fixed;bottom: 0;left: 0;width: 100%;">
        &copy; 2025 IntelliTutor. All Rights Reserved.
    </footer>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/1.3.5/jspdf.debug.js"></script>
</body>
</html>
